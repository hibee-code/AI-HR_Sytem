name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: npm test -- --ci

      - name: Build
        run: npm run build

      # Throwaway Postgres (pgvector) + Redis via docker compose: migrations
      # (run → drift check → revert all → rerun), then the full e2e suite.
      - name: Migrations + e2e
        run: npm run test:e2e:docker -- --ci

      - name: Production image builds
        run: docker build --target runtime -t ai-hr-system:ci .

# Production stack for a single VPS:  Internet → Caddy (TLS) → app → Postgres / Redis
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Needs a .env (or APP_ENV_FILE) with NODE_ENV=production plus DOMAIN, ACME_EMAIL,
# DB_PASSWORD and REDIS_PASSWORD — see .env.example. Only Caddy publishes ports;
# Postgres and Redis are reachable solely on the internal network.
name: ai-hr-system

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp' # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. hr.example.com}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL for Let's Encrypt notices}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates — keep this volume
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    expose:
      - '3000'
    # Migrations + permission catalogue under an advisory lock (safe with
    # several replicas), then the API. A failed migration stops the deploy.
    command: sh -c "node dist/database/migrate.js && exec node dist/main"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: '20m', max-file: '5' }

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF so queued jobs survive restarts; noeviction because BullMQ must not lose keys.
    # The password reaches Redis via the environment, never the command line.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    # maxmemory keeps Redis from exhausting the VPS; /health/ready reports
    # down above 90% of it, before writes would start failing.
    command:
      ['sh', '/usr/local/bin/redis.sh', '--appendonly', 'yes', '--maxmemory', '${REDIS_MAXMEMORY:-256mb}', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.sh:/usr/local/bin/redis.sh:ro
    healthcheck:
      test: ['CMD', 'sh', '/usr/local/bin/redis.sh', '--health']
      interval: 5s
      timeout: 3s
      retries: 20

  # Daily pg_dump to ./backups (verified, pruned after BACKUP_KEEP_DAYS).
  # Copy off the server with BACKUP_UPLOAD_CMD — a backup on the same disk
  # doesn't survive losing that disk. Restore: scripts/db-restore.sh.
  backup:
    image: pgvector/pgvector:pg16 # same major version as the database
    restart: unless-stopped
    entrypoint: ['sh', '/usr/local/bin/backup.sh']
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USERNAME:?set DB_USERNAME in .env}
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      PGDATABASE: ${DB_NAME:?set DB_NAME in .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-2}
      BACKUP_UPLOAD_CMD: ${BACKUP_UPLOAD_CMD:-}
    volumes:
      - ./backups:/backups
      - ./docker/backup/backup.sh:/usr/local/bin/backup.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:

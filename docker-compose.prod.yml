# Production stack for a single VPS:  Internet → Caddy (TLS) → app → Postgres / Redis
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Needs a .env (or APP_ENV_FILE) with NODE_ENV=production plus DOMAIN, ACME_EMAIL,
# DB_PASSWORD and REDIS_PASSWORD — see .env.example. Only Caddy publishes ports;
# Postgres and Redis are reachable solely on the internal network.
name: ai-hr-system

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp' # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. hr.example.com}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL for Let's Encrypt notices}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates — keep this volume
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    expose:
      - '3000'
    # Schema first, then the permission catalogue (new permissions reach the
    # system roles), then the API. A failed migration stops the deploy.
    command: >-
      sh -c "npm run migration:run:prod &&
             node dist/database/seeds/run-seed.js --catalogue-only &&
             exec node dist/main"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: '20m', max-file: '5' }

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:?set DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF so queued jobs survive restarts; noeviction because BullMQ must not lose keys.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - --appendonly
      - 'yes'
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:

# Local development stack. Credentials come only from .env (no defaults here):
#   docker compose --profile dev up -d postgres redis mailpit
name: ai-hr-system

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hr-redis
    restart: unless-stopped
    # REDIS_PASSWORD from .env is optional in dev: set → Redis requires it, empty → no auth.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ['sh', '/usr/local/bin/redis.sh', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.sh:/usr/local/bin/redis.sh:ro
    healthcheck:
      test: ['CMD', 'sh', '/usr/local/bin/redis.sh', '--health']
      interval: 5s
      timeout: 3s
      retries: 10

  # Local SMTP sink with a web UI at http://localhost:8025 — catches all outgoing mail in dev.
  mailpit:
    image: axllent/mailpit:latest
    container_name: hr-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    profiles: ['dev']

  app:
    build:
      context: .
      target: runtime
    container_name: hr-app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      SMTP_HOST: mailpit
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Migrations run before the app starts so the schema is always current.
    command: sh -c "node dist/database/migrate.js && exec node dist/main"
    profiles: ['full']

volumes:
  postgres_data:
  redis_data:

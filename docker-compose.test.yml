# Throwaway infrastructure for the e2e suite and migration checks.
# Data lives in tmpfs and ports are offset (5433 / 6380) so it never collides
# with a dev stack or anything else on the host. Driven by scripts/e2e-docker.sh,
# which supplies the TEST_* credentials (from .env, or random per run).
name: ai-hr-system-test

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${TEST_DB_USERNAME:?run via scripts/e2e-docker.sh or set TEST_DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?run via scripts/e2e-docker.sh or set TEST_DB_PASSWORD in .env}
      POSTGRES_DB: ${TEST_DB_NAME:?run via scripts/e2e-docker.sh or set TEST_DB_NAME in .env}
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${TEST_REDIS_PASSWORD:?run via scripts/e2e-docker.sh or set TEST_REDIS_PASSWORD in .env}
    command: ['sh', '/usr/local/bin/redis.sh', '--save', '', '--appendonly', 'no', '--maxmemory-policy', 'noeviction']
    volumes:
      - ./docker/redis/redis.sh:/usr/local/bin/redis.sh:ro
    ports:
      - '127.0.0.1:6380:6379'
    healthcheck:
      test: ['CMD', 'sh', '/usr/local/bin/redis.sh', '--health']
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit
    ports:
      - '127.0.0.1:8025:8025' # web inbox -> http://localhost:8025
      - '127.0.0.1:1025:1025' # SMTP
